<!--
  Template du composant MonstersList : le formulaire d'ajout (aside)
  + l'archive (section : compteur, recherche, tableau).
  Le <tbody> est volontairement VIDE : les lignes sont ajoutées par le JS
  (une par instance de Monster).
-->

<!-- Aside gauche pour le formulaire -->
<aside class="deco-frame md:w-1/3 p-6 bg-[var(--murk)]/60 self-start">
  <h2 class="display text-2xl mb-5 text-[var(--pearl)]">File a new creature</h2>

  <!-- novalidate : la validation est faite en JS (Monster.validate) -->
  <form class="add-form" novalidate>
    <label class="block mb-4 text-[var(--silver)]">
      Name
      <input type="text" name="name" class="new-name field" placeholder="The Crawling Mass" />
    </label>

    <label class="block mb-4 text-[var(--silver)]">
      Type
      <select name="type" class="new-type field">
        <option>Giant reptile</option>
        <option>Alien</option>
        <option>Mutant</option>
        <option>Giant insect</option>
        <option>Robot</option>
        <option>Deep-sea creature</option>
      </select>
    </label>

    <label class="block mb-4 text-[var(--silver)]">
      Danger level (1 to 5)
      <input type="number" name="dangerLevel" min="1" max="5" class="new-danger field" placeholder="3" />
    </label>

    <label class="block mb-6 text-[var(--silver)]">
      Release year
      <input type="number" name="year" min="1950" max="1969" class="new-year field" placeholder="1957" />
    </label>

    <button type="submit" class="btn btn-lipstick w-full py-3 px-4 text-lg">Add to the archive</button>
  </form>
</aside>

<!-- Section droite pour la liste des créatures -->
<section class="deco-frame md:w-2/3 p-6 bg-[var(--murk)]/40">
  <div class="flex flex-wrap justify-between items-baseline gap-2 mb-5">
    <h2 class="display text-2xl">The archive</h2>
    <p class="text-[var(--silver)]">
      Creatures on file :
      <span class="monsters-count display text-2xl text-[var(--gold)]">0</span>
    </p>
  </div>

  <!-- Filtre de recherche -->
  <input type="search" class="search-input field mb-5" placeholder="Search by name or type" />

  <!-- Liste des créatures triée et filtrée -->
  <div class="overflow-x-auto">
    <table class="monsters-table w-full">
      <thead>
        <tr>
          <!-- data-sort = nom de la propriété de Monster utilisée pour trier -->
          <th class="text-left p-3">
            <a href="#" data-sort="name">Name <span class="sort-indicator" aria-hidden="true"></span></a>
          </th>
          <th class="text-left p-3">
            <a href="#" data-sort="type">Type <span class="sort-indicator" aria-hidden="true"></span></a>
          </th>
          <th class="text-left p-3">
            <a href="#" data-sort="dangerLevel">Danger <span class="sort-indicator" aria-hidden="true"></span></a>
          </th>
          <th class="text-left p-3">
            <a href="#" data-sort="year">Year <span class="sort-indicator" aria-hidden="true"></span></a>
          </th>
          <th class="text-right p-3">Actions</th>
        </tr>
      </thead>
      <tbody class="monsters-body"></tbody>
    </table>
  </div>

  <!-- Message d'état : chargement, erreur, liste vide (masqué quand vide) -->
  <p class="status hidden text-center text-[var(--silver)] italic mt-5" role="status"></p>
</section>
